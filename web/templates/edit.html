<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit {{ filename }}</title>
  <link rel="stylesheet" href="../static/css/styles.css">
</head>
<body>
  <header class="top-banner">
    <h1>EDULLM</h1>
  </header>
  <div class="container">
    <aside class="sidebar">
      <button onclick="window.location.href='{{ url_for('files') }}'">Back to Files</button>
    </aside>
    <main class="main-content">
      <h2>Editing File: {{ filename }}</h2>
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <ul class="flashes">
            {% for message in messages %}
              <li>{{ message }}</li>
            {% endfor %}
          </ul>
        {% endif %}
      {% endwith %}
      <form action="{{ url_for('edit_file', filename=filename) }}" method="post">
        <textarea name="content" rows="20" cols="80">{{ content }}</textarea><br>
        <button type="submit">Save Changes</button>
      </form>
    </main>
  </div>
</body>
</html>
